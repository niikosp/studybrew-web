<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Είσοδος | StudyBrew</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <nav>
        <div class="logo"><a href="index.html" style="text-decoration: none; color: inherit;">Study<span>Brew</span></a></div>
        <ul>
            <li><a href="index.html#features">Λειτουργίες</a></li>
            <li><a href="index.html#about">About us</a></li>
            <li><a href="register.html" class="btn-nav">Εγγραφή</a></li>
        </ul>
    </nav>

    <section class="form-section">
        <div class="form-container">
            <h2>Καλώς ήρθες ξανά ☕</h2>
            <p>Κάνε είσοδο για να δεις τις κρατήσεις σου.</p>
            
            <form action="#" method="POST" class="register-form">
                
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Το email σου" required>
                </div>

                <div class="input-group">
                    <label for="password">Κωδικός Πρόσβασης</label>
                    <input type="password" id="password" name="password" placeholder="Ο κωδικός σου" required>
                </div>

                <div style="text-align: right; margin-top: -10px; margin-bottom: 20px;">
                    <a href="#" style="font-size: 13px; color: #d48a56; text-decoration: none;">Ξέχασες τον κωδικό;</a>
                </div>

                <button type="submit" class="btn-primary form-btn">Είσοδος</button>
                
                <p class="login-link">Δεν έχεις λογαριασμό; <a href="register.html">Γίνε μέλος</a></p>
            </form>
        </div>
    </section>

</body>
</html>
